name: VoiceInk iOS single-repo migration

on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore an existing green exact-SHA verification
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/voiceink-build.yml"
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "scripts/check-find-reusable-ci-run.sh"
      - "scripts/find-reusable-ci-run.sh"
      - "scripts/verify-ios-single-repo-migration.sh"
      - "scripts/verify-static-whisper-app.sh"
      - "scripts/verify-static-whisper-xcframework.sh"
      - "VoiceInkCore/**"
      - "VoiceInkNVIDIA/**"
      - "iOS/**"
      - "VoiceInk/Info.plist"
      - "VoiceInk/Resources/Sounds/**"
      - "VoiceInk/Transcription/FluidAudio/FluidAudioModelManager.swift"
      - "VoiceInk/Transcription/Streaming/FluidAudioStreamingProvider.swift"
      - "VoiceInk/Transcription/Streaming/FluidAudioWordTimingAdapter.swift"
      - "VoiceInk/VoiceInk.entitlements"
      - "VoiceInk/VoiceInk.local.entitlements"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"
  push:
    branches:
      - main
      - "ci/**" # Temporary CI transport branches during the migration.
    paths:
      - ".github/workflows/voiceink-build.yml"
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "scripts/check-find-reusable-ci-run.sh"
      - "scripts/find-reusable-ci-run.sh"
      - "scripts/verify-ios-single-repo-migration.sh"
      - "scripts/verify-static-whisper-app.sh"
      - "scripts/verify-static-whisper-xcframework.sh"
      - "VoiceInkCore/**"
      - "VoiceInkNVIDIA/**"
      - "iOS/**"
      - "VoiceInk/Info.plist"
      - "VoiceInk/Resources/Sounds/**"
      - "VoiceInk/Transcription/FluidAudio/FluidAudioModelManager.swift"
      - "VoiceInk/Transcription/Streaming/FluidAudioStreamingProvider.swift"
      - "VoiceInk/Transcription/Streaming/FluidAudioWordTimingAdapter.swift"
      - "VoiceInk/VoiceInk.entitlements"
      - "VoiceInk/VoiceInk.local.entitlements"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"

permissions:
  contents: read

concurrency:
  group: namespace-profile-roma-jt
  cancel-in-progress: false
  queue: max

jobs:
  reuse:
    name: Find reusable exact-SHA verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      hit: ${{ steps.result.outputs.hit }}
      run_id: ${{ steps.lookup.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check exact-SHA reuse behavior
        run: bash scripts/check-find-reusable-ci-run.sh

      - name: Find green verification with live proof artifacts
        id: lookup
        if: inputs.force != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/find-reusable-ci-run.sh \
            voiceink-ios-single-repo-migration.yml \
            "$GITHUB_SHA" \
            roma.just.talk.ios-simulator.app \
            ios-runtime-proof

      - name: Report reused verification
        if: steps.lookup.outputs.hit == 'true'
        run: echo "Reusing verification run ${{ steps.lookup.outputs.run_id }} for $GITHUB_SHA"

      - name: Download reused Simulator app
        if: steps.lookup.outputs.hit == 'true'
        id: download_app
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: roma.just.talk.ios-simulator.app
          path: reused-artifacts/ios-app
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download reused runtime proof
        if: steps.download_app.outcome == 'success'
        id: download_proof
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-runtime-proof
          path: reused-artifacts/runtime-proof
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Republish reused Simulator app
        if: steps.download_proof.outcome == 'success'
        id: upload_app
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: roma.just.talk.ios-simulator.app
          path: reused-artifacts/ios-app/roma.just.talk.ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Republish reused runtime proof
        if: steps.upload_app.outcome == 'success'
        id: upload_proof
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-proof
          path: reused-artifacts/runtime-proof
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Resolve reusable verification
        id: result
        if: always()
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.hit }}
          DOWNLOAD_APP_OUTCOME: ${{ steps.download_app.outcome }}
          DOWNLOAD_PROOF_OUTCOME: ${{ steps.download_proof.outcome }}
          UPLOAD_APP_OUTCOME: ${{ steps.upload_app.outcome }}
          UPLOAD_PROOF_OUTCOME: ${{ steps.upload_proof.outcome }}
        run: |
          if [[ "$CACHE_HIT" == true \
            && "$DOWNLOAD_APP_OUTCOME" == success \
            && "$DOWNLOAD_PROOF_OUTCOME" == success \
            && "$UPLOAD_APP_OUTCOME" == success \
            && "$UPLOAD_PROOF_OUTCOME" == success ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify single-repo migration
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.hit != 'true' }}
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run config verifier
        run: bash scripts/verify-ios-single-repo-migration.sh

      - name: Run VoiceInkCore checks
        run: swift run --package-path VoiceInkCore VoiceInkCoreChecks

      - name: Prepare local Whisper framework
        run: make setup

      - name: Build iOS app
        run: |
          xcodebuild build \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/.local-build-ios" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ENTITLEMENTS_ALLOWED=YES

      - name: Verify Whisper is statically linked
        run: bash scripts/verify-static-whisper-app.sh "$PWD/.local-build-ios/Build/Products/Debug-iphonesimulator/roma just talk.app"

      - name: Package iOS Simulator app
        run: |
          APP="$PWD/.local-build-ios/Build/Products/Debug-iphonesimulator/roma just talk.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" roma.just.talk.ios-simulator.app.zip

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: roma.just.talk.ios-simulator.app
          path: roma.just.talk.ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Run iOS test bundles
        id: ios_tests
        continue-on-error: true
        run: |
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json \
              | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          test -n "$SIMULATOR_UDID"
          test "$SIMULATOR_UDID" != "null"
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          APP="$PWD/.local-build-ios/Build/Products/Debug-iphonesimulator/roma just talk.app"
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          APP_GROUPS="$(
            xcrun simctl get_app_container \
              "$SIMULATOR_UDID" \
              com.negentropi.RomaJustTalk \
              groups
          )"
          printf '%s\n' "$APP_GROUPS"
          [[ "$APP_GROUPS" == *"group.com.negentropi.RomaJustTalk"* ]]
          xcodebuild test \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$PWD/.local-build-ios" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ENTITLEMENTS_ALLOWED=YES \
            -only-testing:VoiceInk-iosTests \
            -only-testing:VoiceInk-iosUITests

      - name: Upload iOS runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-proof
          path: .local-build-ios/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Upload iOS test diagnostics
        if: steps.ios_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            .local-build-ios/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/roma just talk*.ips
          if-no-files-found: warn
          retention-days: 3

      - name: Print iOS crash reports
        if: steps.ios_tests.outcome == 'failure'
        run: |
          shopt -s nullglob
          reports=("$HOME"/Library/Logs/DiagnosticReports/roma\ just\ talk*.ips)
          for report in "${reports[@]}"; do
            echo "Crash report: $report"
            sed -n '1,360p' "$report"
          done

      - name: Fail when focused iOS parity tests fail
        if: steps.ios_tests.outcome == 'failure'
        run: exit 1
